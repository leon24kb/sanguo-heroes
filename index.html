<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国群英传 - 卡牌知识问答</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/card-detail.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/campaign.css">
    <link rel="stylesheet" href="css/achievements.css">
    <link rel="stylesheet" href="css/collection.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <header id="app-header">
        <h1 class="app-title">三国群英传</h1>
        <div class="progress-bar-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
                <span class="progress-text" id="progress-text">已收集 0/86</span>
            </div>
        </div>
        <nav class="header-nav">
            <button class="seal-btn" id="btn-campaign" title="战役模式">战役</button>
            <button class="seal-btn" id="btn-endless" title="无尽挑战">无尽</button>
            <button class="seal-btn" id="btn-achievements" title="成就">成就</button>
            <button class="seal-btn" id="btn-collection" title="图鉴">图鉴</button>
            <button class="seal-btn" id="btn-pinyin" title="拼音开关">拼音</button>
            <button class="seal-btn" id="btn-dark-mode" title="深色模式">🌙</button>
        </nav>
    </header>

    <main id="app-main">
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="wei">魏</button>
            <button class="filter-btn" data-filter="shu">蜀</button>
            <button class="filter-btn" data-filter="wu">吴</button>
            <button class="filter-btn" data-filter="qun">群</button>
        </div>
        <div class="card-grid" id="card-grid">
            <!-- 卡片由JS动态生成 -->
        </div>
        <section class="campaign-recommend" id="campaign-recommend">
            <!-- 推荐战役区 -->
        </section>
    </main>

    <footer id="app-footer">
        <div class="footer-line"></div>
        <p class="footer-text">三国群英传 · 卡牌知识问答游戏</p>
        <p class="footer-sub">基于《三国演义》原著 · 仅供学习交流</p>
    </footer>

    <!-- 弹窗容器 -->
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal"></div>

    <script src="js/data.js"></script>
    <script src="js/quiz-bank.js"></script>
    <script src="js/unlock.js"></script>
    <script src="js/pinyin-helper.js"></script>
    <script src="js/card.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/campaign.js"></script>
    <script src="js/endless.js"></script>
    <script src="js/collection.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/app.js"></script>
    <link rel="stylesheet" href="css/tip.css">
    <script src="js/tip.js"></script>
    <!-- 打赏浮动按钮 -->
    <button class="tip-float-btn" onclick="TipManager.show()" title="打赏作者">💰</button>
    <!-- 回到顶部按钮 -->
    <button class="back-to-top" id="backToTop" onclick="App.scrollToTop()" title="回到顶部">⬆️</button>
</body>
</html>
